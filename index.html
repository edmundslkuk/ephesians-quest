function playTone(frequency,start,duration,volume=.055,type='sine',slideTo=null){

  gain.gain.exponentialRampToValueAtTime(volume,now+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  os.connect(gain).connect(ctx.destination);os.start(now);os.stop(now+duration+.04);
}
function playNoise(delay,duration,volume=.08){
  const ctx=getAudio();if(!ctx)return;
  const sampleCount=Math.floor(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,sampleCount,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<sampleCount;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/sampleCount,1.25);
  const src=ctx.createBufferSource();src.buffer=buffer;
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=950;
  const gain=ctx.createGain();gain.gain.setValueAtTime(volume,ctx.currentTime+delay);

  src.connect(filter).connect(gain).connect(ctx.destination);src.start(ctx.currentTime+delay);src.stop(ctx.currentTime+delay+duration+.01);
}

    if(chIndex===0){scene.classList.remove('ch1-stage-2');scene.classList.add('ch1-stage-3');playSound('approach');}
    else if(chIndex===1){scene.classList.add('wall-broken');playSound('wall');}
    else {scene.classList.add('chest-open');playSound('chest');}
  }));
  const message=transitionSentences[chIndex];
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const interval=reduced?8:50;
  let at=0;
  setTimeout(()=>{
    const ticker=setInterval(()=>{
      at++;
      caption.textContent=message.slice(0,at);
      if(at>=message.length){
        clearInterval(ticker);
        setTimeout(()=>{animationLock=false;render();callback();},reduced?450:1400);
      }
    },interval);
  },reduced?80:500);
}
function quiz(it, triggerEl){ modal('📖 隱藏寶物', `${heroName()}，你發現了一件隱藏寶物`); let p=document.createElement('p'); p.textContent='若你能回答問題，就能知道這寶物是甚麼，並把它收進背包。'; $('modalBody').append(p); let q=document.createElement('p'); q.textContent=it.q; $('modalBody').append(q); let choices=document.createElement('div'); $('modalBody').append(choices); let feedback=document.createElement('div'); $('modalBody').append(feedback); it.choices.forEach((x,i)=>{ let b=document.createElement('button'); b.className='choice'; b.textContent=String.fromCharCode(65+i)+'. '+x; b.onclick=()=>{ if(i!==it.answer){ feedback.className='feedback'; feedback.textContent='再試一次！想一想這一章的核心思想。'; return } playSound('correct'); b.classList.add('correct'); choices.querySelectorAll('button').forEach(v=>v.disabled=true); feedback.className='feedback'; feedback.innerHTML=`<b>✓ 你找到了：${it.emoji} ${it.name}</b>`; let detail=document.createElement('p'); detail.textContent=it.meaning; feedback.append(detail); $('modalBtns').innerHTML=''; $('modalBtns').append(button('收進背包',()=>{ playSound('collect');animateToBag(triggerEl,it.emoji,()=>{ collected.add(it.id); persist(); close(); const completedNow=completed(current); render(); if(completedNow){ playCompletionSequence(current, ()=>chapterClear()); } }); })); }; choices.appendChild(b); }); $('modalBtns').append(button('稍後再試',close,true)); }
function chapterClear(){ let c=chapters[current]; modal('CHAPTER COMPLETED', `${heroName()}，你完成了第${current+1}章！`); let p=document.createElement('p'); p.textContent=c.summary; $('modalBody').appendChild(p); let a=document.createElement('p'); a.textContent=[`${heroName()}，你已更接近神的居所；下一步你會由神永恆的計劃，走進恩典與合一的旅程。`,`${heroName()}，你已看見隔斷的牆被打開；接下來你要進入奧祕聖所，看看神如何藉教會彰顯祂的智慧。`,`${heroName()}，你已完成第一至第三章；第四至第六章將會在下一次冒險中繼續。`][current]; $('modalBody').append(a); if(current<2) $('modalBtns').append(button('前往下一章 →',()=>{ current++; close(); render(); maybeShowChapterIntro(); })); else $('modalBtns').append(button('查看冒險結局 ✨',()=>{ close(); finish(); })); }
function finish(){ modal('QUEST COMPLETE', `${heroName()}，你已完成第一至第三章的冒險！`); let p=document.createElement('p'); p.textContent='你已收集九件寶物，走過神永恆的計劃、恩典中的合一，以及顯明的奧祕。第四至第六章將繼續帶你探索：如何活出與蒙召相稱的生命。'; $('modalBody').append(p); $('modalBtns').append(button('重新由第一章查看',()=>{ current=0; close(); render(); maybeShowChapterIntro(); }),button('關閉',close,true)); }
function openNameOverlay(){ $('nameInput').value=playerName; $('startOverlay').classList.add('show'); setTimeout(()=>$('nameInput').focus(),20); }
function startWithName(){ const v=$('nameInput').value.trim(); if(!v){ $('nameInput').focus(); return; } playerName=v; persist(); $('startOverlay').classList.remove('show'); render(); maybeShowChapterIntro(); }
$('startBtn').onclick=startWithName; $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') startWithName(); }); $('soundBtn').onclick=()=>{soundOn=!soundOn;storage.setItem(SOUND_KEY,soundOn?'on':'off');updateSoundButton();if(soundOn)playSound('spot');}; updateSoundButton();
$('renameBtn').onclick=openNameOverlay;
function openBag(){
  if(animationLock)return;
  if(window.matchMedia('(max-width:760px)').matches){
    $('inventory').classList.add('open'); $('bagBackdrop').classList.add('show');
    document.body.classList.add('bagVisible');
    $('bagClose').focus();
  } else $('inventory').scrollIntoView({behavior:'smooth'});
}
function closeBag(){
  $('inventory').classList.remove('open'); $('bagBackdrop').classList.remove('show');
  document.body.classList.remove('bagVisible');
}
$('bagTop').onclick=openBag; $('bagFab').onclick=openBag;
$('bagClose').onclick=closeBag; $('bagBackdrop').onclick=closeBag;
window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:760px)').matches)closeBag();});
// The floating bag button yields while the large Next button is on screen.
if('IntersectionObserver' in window){
  const fabObserver=new IntersectionObserver(entries=>{
    $('bagFab').classList.toggle('yieldToNext',entries[0].isIntersecting);
  },{threshold:0.05});
  fabObserver.observe($('sceneFoot'));
}
$('restart').onclick=()=>{ if(animationLock)return; modal('重新開始','確定清除遊戲進度？'); let p=document.createElement('p'); p.textContent='將移除這個瀏覽器目前收集的寶物，但會保留你的名字。'; $('modalBody').append(p); $('modalBtns').append(button('取消',close,true),button('確定重設',()=>{ collected.clear(); current=0; chapterSeen.clear(); persist(); close(); render(); maybeShowChapterIntro(); })) };
$('modalWrap').onclick=e=>{ if(e.target===$('modalWrap')) close(); }; document.addEventListener('keydown',e=>{ if(e.key==='Escape'){if($('modalWrap').classList.contains('show'))close();else closeBag();} });
if(playerName){ $('startOverlay').classList.remove('show'); render(); } else { openNameOverlay(); }
</script>
